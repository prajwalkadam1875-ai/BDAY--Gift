<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varsha - My Luck ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background:
    radial-gradient(circle at 20% 20%, rgba(255,77,109,.12), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(142,45,226,.15), transparent 35%),
    #100718;
  color: white;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* BACKGROUND ORBS */

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .28;
  pointer-events: none;
  animation: float 10s ease-in-out infinite alternate;
}

.o1 {
  width: 450px;
  height: 450px;
  background: #ff4d6d;
  top: -180px;
  left: -180px;
}

.o2 {
  width: 380px;
  height: 380px;
  background: #8e2de2;
  right: -150px;
  bottom: -130px;
  animation-delay: 2s;
}

.o3 {
  width: 300px;
  height: 300px;
  background: #ff758c;
  left: 40%;
  bottom: -180px;
  animation-delay: 4s;
}

@keyframes float {
  from {
    transform: translate(0,0);
  }
  to {
    transform: translate(30px,-25px);
  }
}

/* TOP BAR */

.topBar {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}

.iconBtn {
  width: 45px;
  height: 45px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  color: white;
  font-size: 20px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: .3s;
}

.iconBtn:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,.15);
}

/* PAGES */

.page {
  position: absolute;
  inset: 0;
  padding: 25px;
  display: flex;
  justify-content: center;
  align-items: center;

  opacity: 0;
  visibility: hidden;
  transform: translateX(40px) scale(.97);

  transition:
    opacity .6s ease,
    transform .6s ease,
    visibility .6s;
}

.page.active {
  opacity: 1;
  visibility: visible;
  transform: translateX(0) scale(1);
}

/* CARD */

.card {
  width: 100%;
  max-width: 440px;
  max-height: calc(100vh - 50px);

  padding: 28px 26px;

  text-align: center;

  border: 1px solid rgba(255,255,255,.16);
  border-radius: 36px;

  background: rgba(255,255,255,.075);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.1);

  overflow-y: auto;
  scrollbar-width: none;
}

.card::-webkit-scrollbar {
  display: none;
}

/* HEADINGS */

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3.7rem;
  line-height: 1;
  margin-bottom: 6px;

  background: linear-gradient(
    120deg,
    #fff,
    #ffb3c1,
    #ff4d6d
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

h2 {
  font-size: .65rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #ff9fb1;
  margin-bottom: 10px;
}

/* PHOTO */

.photoBox {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 16px auto 20px;
}

.photoBox img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  border-radius: 30px;
  border: 4px solid rgba(255,255,255,.2);

  box-shadow:
    0 20px 45px rgba(0,0,0,.55),
    0 0 35px rgba(255,77,109,.28);

  transition: .5s;
}

.photoBox img:hover {
  transform: scale(1.035) rotate(1deg);
}

/* SMALL HEART ON PHOTO */

.photoBox::after {
  content: "❤️";
  position: absolute;
  top: -10px;
  right: -10px;

  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,77,109,.9);
  border-radius: 50%;

  font-size: 18px;

  box-shadow: 0 8px 20px rgba(255,77,109,.35);
}

/* TEXT */

.thought {
  font-family: 'Caveat', cursive;
  font-size: 1.38rem;
  line-height: 1.45;
  color: #fff5f7;
}

.tags {
  margin-top: 10px;
}

.tag {
  display: inline-block;

  padding: 6px 12px;
  margin: 4px;

  border-radius: 20px;

  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);

  font-size: .78rem;
}

/* BUTTON */

.btn {
  margin-top: 18px;

  padding: 13px 30px;

  border: none;
  border-radius: 30px;

  background: linear-gradient(
    135deg,
    #ff4d6d,
    #c9184a
  );

  color: white;

  font-family: 'Poppins', sans-serif;
  font-weight: 600;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(255,77,109,.3);

  transition: .3s;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow:
    0 15px 35px rgba(255,77,109,.45);
}

/* GIFT */

.gift {
  font-size: 85px;
  margin: 5px 0;
  animation: giftBounce 2s ease-in-out infinite;
}

@keyframes giftBounce {
  0%,100% {
    transform: translateY(0) rotate(0);
  }

  50% {
    transform: translateY(-10px) rotate(3deg);
  }
}

/* DOTS */

.dots {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 6px;

  padding: 8px 13px;

  border-radius: 30px;

  background: rgba(0,0,0,.25);
  backdrop-filter: blur(10px);

  z-index: 100;
}

.dot {
  width: 20px;
  height: 5px;

  border-radius: 10px;

  background: rgba(255,255,255,.25);

  cursor: pointer;

  transition: .35s;
}

.dot.on {
  width: 34px;
  background: #ff4d6d;
}

/* SPECIAL LAST PAGE */

.lastPage .photoBox {
  margin-bottom: 12px;
}

.lastPage .thought {
  font-size: 1.25rem;
}

  .page {
    padding: 10px;
    align-items: center;
    overflow-y:
